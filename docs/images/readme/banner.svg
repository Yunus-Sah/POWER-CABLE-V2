  <text x="68" y="230" fill="#f6f9fc" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="3">POWER CABLE</text>
  <text x="72" y="286" fill="#42d58b" font-family="Arial, Helvetica, sans-serif" font-size="27">Programmable resistance · live feedback · adaptive training</text>
