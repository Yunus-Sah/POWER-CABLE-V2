  <path d="M1200 180 C1240 180 1250 232 1215 245 C1180 258 1160 278 1160 320" fill="none" stroke="url(#cable)" stroke-width="13" stroke-linecap="round"/>
  <path d="M1160 320 h-36 m18 0 v18" stroke="#42d58b" stroke-width="10" stroke-linecap="round"/>
  <rect x="72" y="62" width="98" height="8" rx="4" fill="#16a3ff"/>
