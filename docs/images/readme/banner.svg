<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">POWER CABLE</title>
  <desc id="desc">Intelligent motorised cable training with live feedback</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.58" stop-color="#0b2337"/>
      <stop offset="1" stop-color="#123b58"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" x2="1">
      <stop offset="0" stop-color="#16a3ff"/>
